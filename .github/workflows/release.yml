name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.4.0 (no leading v — matches VERSION file / existing tags)"
        required: true
        type: string
      prerelease:
        description: "Mark the GitHub Release as a pre-release"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: sucata-linux-amd64
            ext: ""
            shdc-bin: sokol-shdc-linux
          - os: windows-latest
            target: sucata-win-amd64
            ext: ".exe"
            shdc-bin: sokol-shdc-win.exe
          - os: macos-14 
            target: sucata-osx-arm64
            ext: ""
            shdc-bin: sokol-shdc-osx-arm
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout sucata-cli
        uses: actions/checkout@v4
        with:
          repository: sucata-engine/sucata-cli
          path: sucata-cli

      - name: Checkout sucata-player
        uses: actions/checkout@v4
        with:
          repository: sucata-engine/sucata-player
          path: sucata-player

      - name: Setup Odin
        uses: laytan/setup-odin@v2
        with:
          release: latest
          build-type: release_native
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Linux build deps for sokol
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libglu1-mesa-dev mesa-common-dev xorg-dev libasound-dev

      - name: Setup MSVC dev environment for sokol
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      # laytan/setup-odin installs its own LLVM 18 and prepends it to PATH (Odin
      # needs it for codegen). That shadows Apple's own clang, and a vanilla
      # LLVM clang can't fully parse Apple's SDK headers (breaks NSInteger /
      # NSUInteger while compiling sokol_gfx.c's Metal include chain). Put
      # /usr/bin back in front so native C builds (sokol, stb, miniaudio) use
      # Apple's clang, and point xcode-select at the full Xcode while at it.
      - name: Prefer Apple clang for native macOS builds
        if: runner.os == 'macOS'
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          echo "/usr/bin" >> "$GITHUB_PATH"

      # Odin's vendor:lua/5.4 only ships a prebuilt library for Windows and
      # Linux amd64 — on macOS it falls back to Odin's `system:lua5.4` foreign
      # import too, same deal as SDL3 above.
      - name: Install Lua 5.4 (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install lua@5.4
          echo "LIBRARY_PATH=$(brew --prefix lua@5.4)/lib:$LIBRARY_PATH" >> "$GITHUB_ENV"

      # sucata-player links SDL3 (gamepad) via Odin's `system:SDL3` foreign
      # import on Linux/macOS — Windows is fine as-is since Odin's vendor:sdl3
      # already ships a prebuilt SDL3.dll/.lib for it.
      - name: Setup SDL3
        if: runner.os != 'Windows'
        id: sdl
        uses: libsdl-org/setup-sdl@main
        with:
          version: 3-latest
          install-linux-dependencies: true
          add-to-environment: true

      - name: Expose SDL3 to the linker
        if: runner.os != 'Windows'
        run: |
          echo "LIBRARY_PATH=${{ steps.sdl.outputs.prefix }}/lib:$LIBRARY_PATH" >> "$GITHUB_ENV"
          echo "CPATH=${{ steps.sdl.outputs.prefix }}/include:$CPATH" >> "$GITHUB_ENV"

      # Odin's vendor:stb (sucata-cli image recompression) and vendor:miniaudio
      # (sucata-player audio) ship source only — need their own one-time
      # native build, same deal as sokol. Invoked directly (not via `cmd /c`,
      # which Git Bash on Windows mangles: `/c` gets read as a POSIX path and
      # rewritten to a drive letter) — Git Bash executes .bat/.cmd files fine
      # on their own, same as the `pwsh -File ...` calls below.
      - name: Build Odin vendor libs (stb, miniaudio)
        run: |
          ODIN_ROOT=$(odin root)
          if [ "$RUNNER_OS" = "Windows" ]; then
            sed -i 's/-MT/-MD/' "$ODIN_ROOT/vendor/stb/src/build.bat"
            sed -i 's/-MT/-MD/' "$ODIN_ROOT/vendor/miniaudio/src/build.bat"
            pushd "$ODIN_ROOT/vendor/stb/src" >/dev/null
            ./build.bat
            popd >/dev/null
            pushd "$ODIN_ROOT/vendor/miniaudio/src" >/dev/null
            ./build.bat
            popd >/dev/null
          else
            sh "$ODIN_ROOT/vendor/stb/src/build_stb.sh"
            sh "$ODIN_ROOT/vendor/miniaudio/src/build_miniaudio.sh"
          fi

      - name: Install shared libs
        run: |
          for pkg in sucata-cli sucata-player; do
            pushd "$pkg" >/dev/null
            if [ "$RUNNER_OS" = "Windows" ]; then
              pwsh -File scripts/install-shared/win.ps1
            else
              bash scripts/install-shared/unix.sh
            fi
            popd >/dev/null
          done

      - name: Build sucata-cli + sucata-player (release)
        run: |
          for pkg in sucata-cli sucata-player; do
            pushd "$pkg" >/dev/null
            if [ "$RUNNER_OS" = "Windows" ]; then
              ./scripts/build-release/win.cmd
            else
              bash scripts/build-release/unix.sh
            fi
            popd >/dev/null
          done

      - name: Assemble package
        run: |
          set -e
          PKG="dist/${{ matrix.target }}"
          mkdir -p "$PKG"

          cp "sucata-cli/sucata${{ matrix.ext }}" "$PKG/"
          cp "sucata-player/sucata-player${{ matrix.ext }}" "$PKG/"
          chmod +x "$PKG/sucata${{ matrix.ext }}" "$PKG/sucata-player${{ matrix.ext }}"

          if [ "$RUNNER_OS" = "Windows" ]; then
            cp sucata-player/lua54.dll sucata-player/SDL3.dll "$PKG/"
          fi

          if [ -n "${{ matrix.shdc-bin }}" ]; then
            mkdir -p "$PKG/sokol-shdc"
            cp "sucata-cli/sokol-shdc/${{ matrix.shdc-bin }}" "$PKG/sokol-shdc/"
            chmod +x "$PKG/sokol-shdc/${{ matrix.shdc-bin }}"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/${{ matrix.target }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bump VERSION
        run: echo "${{ inputs.version }}" > VERSION

      - name: Commit VERSION bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add VERSION
          git diff --staged --quiet || git commit -m "release: ${{ inputs.version }}"
          git push

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Zip each platform package
        run: |
          cd artifacts
          for dir in */; do
            name="${dir%/}"
            (cd "$name" && zip -r "../${name}.zip" .)
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: Sucata ${{ inputs.version }}
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
          files: artifacts/*.zip
